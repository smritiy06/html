<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class</title>
    <style>
        .blue{
            background-color: rgb(222, 234, 244);
        }
        .highlight{
            background-color: bisque;
        }
        #green{
            background-color: darkseagreen;
        }
        table{
            border-collapse: collapse;
            width: 100%;
        }
        td, th{
            border: 1px solid black;
            padding:  10px;
        }
    </style>
</head>
<body>
    <p class="blue">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Vitae, aut.<p>
    <p id="green">Lorem ipsum dolor sit amet consectetur adipisicing elit. Hic, sit.</p>  <!--id is used only once-->
    <h1 class="highlight">Test 1</h1>  <!--class can be used multiple time-->
    <h3>Test 2</h3>

    <table style="width: 50%;">
        <tr>
            <th>Country</th>
            <td>India</td>
            <td>Japan</td>
            <td>Video</td>
        </tr>
        <tr>
            <th>CODE</th>
            <td>IN</td>
            <td>JP</td>
            <td>
                <iframe width="560" height="315" src="https://www.youtube.com/embed/dqAHBb8YMjg?si=7R0vmksFwEhQfK0a" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </td>
        </tr>
    </table>
</body>
</html>
