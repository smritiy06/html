<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
   <h1>My list</h1> 
   <h2>Unordered list</h2>
   <ul style="list-style-type: circle;">
    <li>1
        <ol>
            <li>H.1</li>
            <li>H.2</li>
        </ol>
    </li>  <!-- li -> list item-->
    <li>2</li> 
    <li>3</li>
    <li>4</li>
    <li>5</li>
   </ul>
   <h2>Ordered list</h2>
   <ol type="i">
    <li>One</li>
    <li>Two</li>
    <li>Three</li>
   </ol>
   <h2>Data list</h2>
   <dl>
    <dt>Ice Tea</dt>    <!-- dt -> data topic-->
        <dd>Lemon ice tea</dd> <!--dd -> data discription-->
    <dt>Hot Tea</dt>  
        <dd>Hot lemon tea</dd>
   </dl>
   <h3 class="highlight">Test 1</h3>  <!-- Takes entire line on the page is called block line element-->
   <p>Test 2</p>
   <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Possimus, similique.</p>
   <span>Test 3</span> <!--Takes space just for the text is inline element-->
</body>
</html>
