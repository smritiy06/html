<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Table</title>
    <link rel="stylesheet" href="table_style.css">
</head>
<body>
    <table style="width: 50%;"
    >
        <caption>
            <b>Front-end web developer course</b> 
        </caption>
        <thead>
        <tr>
            <th>Person</th>
            <th>Most interested in</th>
            <th>Age</th>
        </tr></thead>
        <tbody>
        <tr>
            <th>Chris</th>
            <td>HTML tables</td>
            <td>22</td>
        </tr>
        <tr>
            <th>Dennis</th>
            <td>Web accessibility</td>
            <td>45</td>
        </tr>
        <tr>
            <th>Sarah</th>
            <td>JavaScript frameworks</td>
            <td>29</td>
        </tr>
        <tr>
            <th>Karen</th>
            <td>Web performance</td>
            <td>36</td>
        </tr></tbody>
        <tfoot>
        <tr>
            <th colspan="2">Average age</th>
            <td>33</td>
        </tr></tfoot>
    </table>
</body>
</html>
