<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        table{
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        td, th{
            border: 1px solid black;
            padding: 10px;
        }
        tr:nth-child(even){
            background-color: rgb(143, 210, 212);
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Country</th>  <!-- th -> table heading -->
            <th>Country CODE</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>India</td>  <!-- td -> table data -->
            <td>IN</td>
            <td>india@google.com</td>
        </tr>
        <tr>
            <td>United States of America</td>  <!-- td -> table data -->
            <td>USA</td>
            <td>usa@google.com</td>
        </tr>
        <tr>
            <td>Japan</td>  <!-- td -> table data -->
            <td>JP</td>
            <td>jp@google.com</td>
        </tr>
        <tr>
            <td>China</td>  <!-- td -> table data -->
            <td>CN</td>
            <td>cn@google.com</td>
        </tr>
    </table>
</body>
</html>
