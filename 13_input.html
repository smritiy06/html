<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
</head>
<body>
    <h1>Forms in HTML</h1>
    <form action="" method="get" accept-charset="UTF-8" autocomplete="off">
        <label for="fname">First Name: </label><br />
        <input type="text" placeholder="first name" name="" value="smriti" id="fname"><br>
        <label for="lname">Last Name: </label><br />
        <input type="text" placeholder="last name" name="" id="lname"><br>
        <input type="week" name="" id="">
        <input type="time" name="" id="">
        <input type="reset">

        <select name="editors" id="" multiple>
            <option value="vscode">vscode</option>
            <option value="sublime">sublime</option>
        </select>

        <input list="editors" name="editor">
        <datalist id="editors">
            <option value="vscode">vscode</option>
            <option value="sublime">sublime</option>
        </datalist>
        <input type="date" name="" id="">
        <input type="range" name="volume" min="0" max="11" id="">
        <input type="radio" id="">
        <input type="month" name="" id="">
        <input type="color" name="text color" id="">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
